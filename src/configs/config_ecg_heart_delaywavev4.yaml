# ============================================================
# ECG-conditioned 4-D heart mesh trajectory generation
# PhysCtrl / ECGCondMDM with DelayWaveECGEncoderV4
#
# V4 differences vs V3 (config_ecg_heart_delaywavev3.yaml):
#   • Per-(lead, scale) tokenization. The delay branch emits one token
#     per (lead, scale) — shape (B, C*L, D) = (B, 36, D) at default
#     C=12, L=3 — instead of one token per lead. Cross-scale
#     interactions become data-dependent through the delay block's
#     attention.
#   • Fourier-feature lag embedding. The continuous lag value `delta`
#     is lifted with sinusoidal features (log-spaced, scaled to
#     tau_max), then a small MLP maps to latent_dim. Continuous,
#     differentiable through `beta` and the wavelet front-end, and
#     gives a multi-resolution view of the lag value.
#   • Additive lead + scale embeddings (broadcast over the 2-D grid)
#     replace V3's single per-lead positional embedding.
#   • Wavelet front-end and `_delay_descriptor` are byte-identical to
#     V3 — any V3↔V4 difference is attributable solely to the
#     tokenization and lag-embedding changes.
#   • Zero-init `alpha_delay` gate preserved: V4 ≡ PhysioWave at step 0.
# ============================================================

# ------ General --------------------------------------------------
image_size: 128
output_dir: ../checkpoints/ecg_heart_delaywavev4_${model_config.n_layers}L_${model_config.latent_dim}d_${dataset.n_training_frames}frames
seed: 42

# ------ Training -------------------------------------------------
train_batch_size: 10
eval_batch_size:  50
num_train_epochs: 200
max_train_steps:  null
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-5
scale_lr: false
lr_scheduler: cosine_with_warmup
lr_warmup_steps: 200
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 8
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.0e-2
adam_epsilon: 1.0e-8
max_grad_norm: 1.0
prediction_type: null
mixed_precision: bf16

# ------ Logging / checkpointing ----------------------------------
vis_dir: vis
logging_dir: logs
report_to: tensorboard
local_rank: -1
tracker_project_name: ecg_heart_diffusion_delaywavev4
checkpointing_steps: 1000
checkpoints_total_limit: 5
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 500
validation_train_steps: 2000
validation_sanity_check: false
resume_step: null
push_to_hub: false
set_grads_to_none: true
overfit: false

# ------ Evaluation -----------------------------------------------
num_val_batches: 2
num_inference_steps: 50
early_stop_patience: 3

# ------ Loss weights ---------------------------------------------
# Existing diffusion losses
lambda_vel: 1.0
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.0

# Encoder auxiliary losses. V4's forward currently returns an empty
# aux dict (the V2/V3 contrastive/diversity terms are commented out in
# the encoder). The lambdas are kept here so the train-loop aggregator
# at src/train_ecg_mesh.py can pick them up if those terms are
# re-enabled later via getattr(args, f'lambda_{name}', 0.0).
lambda_delay_subject_align: 0.5    # InfoNCE on subject identity (off until aux re-enabled)
lambda_wavelet_diversity:   0.01   # gentle diversity stabilizer (off until aux re-enabled)
lambda_sparsity:            0.002  # gentle soft-argmax sharpener (off until aux re-enabled)
lambda_delay_norm:          0.0    # off by default; ablation knob

# ------ Classifier-free guidance ---------------------------------
condition_drop_rate: 0.1

# ------ Model ----------------------------------------------------
model_type: ecg_cond_mdm
pred_offset: true
pc_size: 388

model_config:
  n_layers: 8
  latent_dim: 256
  # Advisory only; overridden at runtime by encoder.n_tokens
  # (= n_leads * max_level + n_morph_tokens; with defaults 12*3 + 12 = 48).
  n_ecg_tokens: 48
  pred_offset: true
  transformer_block: SpatialTemporalTransformerBlock
  ecg_encoder_type: delaywavev4
  delaywavev4_encoder:
    seq_len: 600
    n_leads: 12
    ref_lead: 1                        # lead II
    # Wavelet front-end (matches PhysioWave ECG recipe)
    max_level: 3
    wave_kernel_size: 24
    wavelet_names: [db4, db6, sym4, coif2]
    use_separate_channel: true
    # Morphology backbone (mirrors PhysioWaveECGEncoder)
    patch_size: 64
    embed_dim: 384
    depth: 8
    num_heads: 12
    mlp_ratio: 4.0
    dropout: 0.1
    use_pos_embed: true
    pos_embed_type: '2d'
    pretrained_path: ../PhysioWave/ecg.pth
    freeze_backbone: false
    # Delay branch
    n_morph_tokens: 8                  # overridden internally to n_leads (=12)
    tau_max: 50                        # ±50 samples ≈ ±100 ms at 500 Hz
    beta_init: 2.0                     # softplus-init temperature
    delay_num_heads: 4
    delay_mlp_ratio: 4.0
    num_freq_bands: 8                  # log-spaced sin/cos bands for delta
    # Contrastive aug knobs (used only if delay_subject_align is re-enabled)
    align_noise_std: 0.05
    align_amp_std: 0.1
    align_temperature: 0.1

# ------ Dataset --------------------------------------------------
dataset:
  ecg_dir:  ../data/ukb_heartmesh_processed/ecg_resting
  mesh_dir: ../data/ukb_heartmesh_processed/ctrl_mesh_ply
  npy_dir:  ../data/ukb_heartmesh_processed/ctrl_mesh
  seq_len:  50
  n_training_frames: 49
  n_points: 388
  train_split: 0.8
  scale: 1.0
  filter_max_displacement: 50.0
  smooth_sigma: 0


train_dataset:
  dataset_path: ""
  dataset_list: ""
  stage: deform
  mode: diff
  pc_size: 388
  repeat: 1
  seed: 42
  n_sample_pro_model: 1
  n_frames_interval: 1
  n_training_frames: 49
  batch_size: 12
  overfit: false
  norm_fac: 0
  has_gravity: false
  max_num_forces: 1
