# ============================================================
# ECG-conditioned 4-D heart mesh trajectory generation
# PhysCtrl / ECGCondMDM with DelayWave ECG encoder
#
# Two-branch encoder built on PhysioWave's BERTWaveletTransformer:
#   • Morphology branch (mirrors PhysioWaveECGEncoder)
#       wavelet_decomp → patch_embed → encoder → proj → adaptive-pool
#       → n_morph_tokens conditioning tokens.
#   • Delay branch (NEW, explicit inter-channel-delay objective)
#       same wavelet_decomp output → per-scale circular cross-correlation
#       vs the reference lead → soft-argmax over the (single-cycle) window
#       → relative-delay matrix Δ(scale, lead) → MLP →
#       PhysioWave TransformerEncoder over leads → mean-pool →
#       1 delay-core token.
#
# The wavelet front-end is shared between branches, so the explicit
# delay objective shapes the same filters that produce the morphology
# tokens. The auxiliary `delay_subject_var` term directly promotes
# per-subject variance in the delay matrix to fight the population-mean
# collapse seen in vis_eval/segment_volumes.svg of the baseline run.
# ============================================================

# ------ General --------------------------------------------------
image_size: 128
output_dir: ../nips26-physctrl-outputs/ecg_heart_delaywavenopool_${model_config.n_layers}L_${model_config.latent_dim}d_${dataset.n_training_frames}frames
seed: 42

# ------ Training -------------------------------------------------
train_batch_size: 12
eval_batch_size:  28
num_train_epochs: 200
max_train_steps:  null
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-5
scale_lr: false
lr_scheduler: cosine_with_warmup
lr_warmup_steps: 200
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 8
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.0e-2
adam_epsilon: 1.0e-8
max_grad_norm: 1.0
prediction_type: null
mixed_precision: bf16

# ------ Logging / checkpointing ----------------------------------
vis_dir: vis
logging_dir: logs
report_to: tensorboard
local_rank: -1
tracker_project_name: ecg_heart_diffusion_delaywave
checkpointing_steps: 1000
checkpoints_total_limit: 5
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 500
validation_train_steps: 2000
validation_sanity_check: false
resume_step: null
push_to_hub: false
set_grads_to_none: true
overfit: false

# ------ Evaluation -----------------------------------------------
num_val_batches: 2
num_inference_steps: 50
early_stop_patience: 3

# ------ Loss weights ---------------------------------------------
# Existing diffusion losses
lambda_vel: 1.0
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.0

# Encoder auxiliary losses (DelayWave-specific).
# Resolved dynamically by the train-loop aggregator at
# src/train_ecg_mesh.py:317-322 via getattr(args, f'lambda_{name}', 0.0).
lambda_shift_inv:         0.5    # MSE between Δ(ecg) and Δ(roll(ecg))
lambda_sparsity:          0.01   # mean entropy of the soft-argmax over T
lambda_wavelet_diversity: 0.05   # negative entropy of wavelet-base softmax
lambda_delay_subject_var: 0.2    # −log Var_b(Δ) — fights population collapse

# ------ Classifier-free guidance ---------------------------------
condition_drop_rate: 0.1

# ------ Model ----------------------------------------------------
model_type: ecg_cond_mdm
pred_offset: true
pc_size: 388

model_config:
  n_layers: 8
  latent_dim: 256
  # Advisory only; overridden at runtime by encoder.n_tokens
  # (= 1 delay-core + n_morph_tokens, default 1 + 8 = 9 for cond_type='concat').
  n_ecg_tokens: 9
  pred_offset: true
  transformer_block: SpatialTemporalTransformerBlock
  ecg_encoder_type: delaywave
  delaywave_encoder:
    seq_len: 600
    n_leads: 12
    ref_lead: 1                        # lead II in the standard 12-lead order
    # Wavelet front-end (matches PhysioWave ECG recipe)
    max_level: 3
    wave_kernel_size: 24
    wavelet_names: [db4, db6, sym4, coif2]
    use_separate_channel: true
    # Morphology backbone (mirrors PhysioWaveECGEncoder)
    patch_size: 64
    embed_dim: 384
    depth: 8
    num_heads: 12
    mlp_ratio: 4.0
    dropout: 0.1
    use_pos_embed: true
    pos_embed_type: '2d'
    pretrained_path: ../PhysioWave/ecg.pth
    freeze_backbone: false
    # Delay branch
    n_morph_tokens: 8
    n_delay_layers: 2
    delay_num_heads: 4
    delay_mlp_ratio: 4.0
    cond_type: concat                  # 'concat' or 'add'

# ------ Dataset --------------------------------------------------
dataset:
  ecg_dir:  ../data/ukb_heartmesh_processed/ecg_resting
  mesh_dir: ../data/ukb_heartmesh_processed/ctrl_mesh_ply
  npy_dir:  ../data/ukb_heartmesh_processed/ctrl_mesh
  seq_len:  50
  n_training_frames: 49
  n_points: 388
  train_split: 0.8
  scale: 1.0
  filter_max_displacement: 50.0
  smooth_sigma: 0


train_dataset:
  dataset_path: ""
  dataset_list: ""
  stage: deform
  mode: diff
  pc_size: 388
  repeat: 1
  seed: 42
  n_sample_pro_model: 1
  n_frames_interval: 1
  n_training_frames: 49
  batch_size: 12
  overfit: false
  norm_fac: 0
  has_gravity: false
  max_num_forces: 1
