# ============================================================
# ECG-conditioned 4-D heart mesh trajectory generation
# PhysCtrl / ECGCondMDM with PhysioWave ECG encoder
# (BERTWaveletTransformer with pretrained ECG weights)
# ============================================================

# ------ General --------------------------------------------------
image_size: 128
output_dir: ../nips26-physctrl-outputs/ecg_heart_physiowavenopool_${model_config.n_layers}L_${model_config.latent_dim}d_${dataset.n_training_frames}frames
seed: 42

# ------ Training -------------------------------------------------
train_batch_size: 10
eval_batch_size:  28
num_train_epochs: 200
max_train_steps:  null
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-5
scale_lr: false
lr_scheduler: cosine_with_warmup
lr_warmup_steps: 200
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 8
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.0e-2
adam_epsilon: 1.0e-8
max_grad_norm: 1.0
prediction_type: null
mixed_precision: bf16

# ------ Logging / checkpointing ----------------------------------
vis_dir: vis
logging_dir: logs
report_to: tensorboard
local_rank: -1
tracker_project_name: ecg_heart_diffusion_physiowave
checkpointing_steps: 1000
checkpoints_total_limit: 5
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 500
validation_train_steps: 2000
validation_sanity_check: false
resume_step: null
push_to_hub: false
set_grads_to_none: true
overfit: false

# ------ Evaluation -----------------------------------------------
num_val_batches: 2
num_inference_steps: 50
early_stop_patience: 3

# ------ Loss weights ---------------------------------------------
lambda_vel: 1.0
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.0

# ------ Classifier-free guidance ---------------------------------
condition_drop_rate: 0.1

# ------ Model ----------------------------------------------------
model_type: ecg_cond_mdm
pred_offset: true
pc_size: 388

model_config:
  n_layers: 8
  latent_dim: 256
  n_ecg_tokens: 8
  pred_offset: true
  transformer_block: SpatialTemporalTransformerBlock
  ecg_encoder_type: physiowave
  physiowave_encoder:
    seq_len: 600
    in_channels: 12
    max_level: 3
    wave_kernel_size: 24
    wavelet_names: [db4, db6, sym4, coif2]
    use_separate_channel: true
    patch_size: 64
    embed_dim: 384
    depth: 8
    num_heads: 12
    mlp_ratio: 4.0
    dropout: 0.1
    use_pos_embed: true
    pos_embed_type: '2d'
    pretrained_path: ../physctrl/PhysioWave/ecg.pth
    freeze_backbone: false

# ------ Dataset --------------------------------------------------
dataset:
  ecg_dir:  ../data/ukb_heartmesh_processed/ecg_resting
  mesh_dir: ../data/ukb_heartmesh_processed/ctrl_mesh_ply
  npy_dir:  ../data/ukb_heartmesh_processed/ctrl_mesh
  seq_len:  50
  n_training_frames: 49
  n_points: 388
  train_split: 0.8
  scale: 1.0
  filter_max_displacement: 50.0
  smooth_sigma: 0


train_dataset:
  dataset_path: ""
  dataset_list: ""
  stage: deform
  mode: diff
  pc_size: 388
  repeat: 1
  seed: 42
  n_sample_pro_model: 1
  n_frames_interval: 1
  n_training_frames: 49
  batch_size: 12
  overfit: false
  norm_fac: 0
  has_gravity: false
  max_num_forces: 1
