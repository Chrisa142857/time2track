[naming]
# Runs dated before this keep their names and layout (grandfathered, reported as warnings).
since = 2026.09.28

# Qualifier tokens that cannot say what changed. A name carrying a metric or seed token
# (e.g. best_val-loss0.012_step900) already says it, so it passes.
bare = final old new best backup bak contaminated v7 v8 v9 v10

# Tokens that carry meaning in this project and are never flagged:
#   train / val / test  split names
#   v1 ... v6           ECG precordial leads V1-V6, and DelayWave encoder versions v1-v4
split = train val test
exempt = v1 v2 v3 v4 v5 v6

# Directories never inspected (vendored or third-party code, environments, caches).
skip = __pycache__ .git .ipynb_checkpoints libs Medformer moment EgoEMG tbvenv pylibs
